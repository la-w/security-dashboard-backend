env:
  contexts:
    - name: Security-Dashboard-Backend
      urls: [https://backend-dev.tbdpwl.dynv6.net]
      excludePaths:
        - ".*/swagger.*"
  parameters:
    failOnError: true
    failOnWarning: false
jobs:
  - type: openapi
    parameters:
      apiUrl: "https://backend-dev.tbdpwl.dynv6.net/swagger/v1/swagger.json"
      context: Security-Dashboard-Backend
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true
  - type: spider
    parameters:
      maxDepth: 3
      maxDuration: 60
  - type: spiderAjax
    parameters:
      maxCrawlDepth: 3
      maxDuration: 240
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      maxRuleDurationInMins: 3
      maxScanDurationInMins: 30
      delayInMs: 50
  - type: report
    parameters:
      template: sarif-json
      reportFile: Zap-Report.sarif
      reportTitle: ZAP Scan Report - Security-Dashboard-Backend
